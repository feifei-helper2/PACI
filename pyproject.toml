[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paci"
version = "0.1.0"
description = "Geometry-matched capacity-aware relational learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "Pillow>=10,<13",
]

[project.scripts]
paci = "paci.cli:main"

[tool.setuptools.packages.find]
include = ["paci*"]
